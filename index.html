<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B6A51">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tournée d'Annabelle la criminelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout : appli mobile à une colonne (max 640px), en-tête collant avec la date, barre d'onglets en bas. Plaine = ocre, Montagne = bleu ardoise, vert maquis pour l'action. */
:root{
  --bg:#EFF4F1; --surface:#FFFFFF; --surface-2:#F6F9F7; --ink:#14221C; --muted:#5A6B62; --line:#D5E0D9;
  --accent:#1B6A51; --accent-ink:#FFFFFF; --accent-soft:#D9EEE4; --rot:#DDF3E1; --rot-line:#9ED2AE;
  --plaine:#8E5F14; --plaine-soft:#F5E9D3; --montagne:#36558A; --montagne-soft:#E0E8F5;
  --ok:#1C7A4A; --ok-soft:#DCF2E5; --warn:#9A5B00; --warn-soft:#FBEDD3; --bad:#B0342A; --bad-soft:#F8E0DC;
  --shadow:0 1px 2px rgba(20,34,28,.06),0 4px 14px rgba(20,34,28,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1814; --surface:#16231D; --surface-2:#1B2A23; --ink:#E5EEE9; --muted:#9BB0A5; --line:#2A3B33;
  --accent:#55C499; --accent-ink:#08170F; --accent-soft:#1A3A2D; --rot:#1F3B2A; --rot-line:#3F7A55;
  --plaine:#E3B468; --plaine-soft:#3A2D17; --montagne:#93B3EA; --montagne-soft:#1D2A42;
  --ok:#5CCB8D; --ok-soft:#173527; --warn:#F2B74E; --warn-soft:#3A2B10; --bad:#F2867A; --bad-soft:#3F1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1814; --surface:#16231D; --surface-2:#1B2A23; --ink:#E5EEE9; --muted:#9BB0A5; --line:#2A3B33;
  --accent:#55C499; --accent-ink:#08170F; --accent-soft:#1A3A2D; --rot:#1F3B2A; --rot-line:#3F7A55;
  --plaine:#E3B468; --plaine-soft:#3A2D17; --montagne:#93B3EA; --montagne-soft:#1D2A42;
  --ok:#5CCB8D; --ok-soft:#173527; --warn:#F2B74E; --warn-soft:#3A2B10; --bad:#F2867A; --bad-soft:#3F1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:6px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:.95rem;letter-spacing:-.01em;margin:0;color:var(--muted)}
.brand:has(small:empty){display:none}
.top .iconbtn{width:34px;height:34px;border-radius:10px}
.top .datebar .d label{font-size:1.05rem}
.brand small{color:var(--muted);font-size:.8rem}
main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:16px}

.datebar{display:flex;align-items:center;gap:8px}
.datebar .d{flex:1;min-width:0;position:relative}
.datebar .d label{display:block;font-family:var(--f-display);font-weight:600;font-size:1.15rem;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebar .d input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}
.pillbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.plaine{background:var(--plaine)} .dot.montagne{background:var(--montagne)}

.summary{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.summary .count{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.summary .count span{font-size:1rem;color:var(--muted);font-weight:600}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.summary .lbl{color:var(--muted);font-size:.85rem}
.alertchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-weight:700;font-size:.82rem;border:0;background:var(--warn-soft);color:var(--warn)}
.alertchip.bad{background:var(--bad-soft);color:var(--bad)}

.banner{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner h3{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.info h3{color:var(--accent)}
.banner p{margin:0;font-size:.9rem}
.checkrow{display:flex;align-items:center;gap:10px;min-width:0}
.checkrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.checkrow .t{min-width:0;overflow-wrap:anywhere}
.checkrow.done .t{text-decoration:line-through;color:var(--muted)}
.checkrow.bilrow.done .t{text-decoration:none}

.slot{display:flex;flex-direction:column;gap:10px}
.slot>h2{font-family:var(--f-display);font-weight:600;font-size:.95rem;margin:4px 0 0;display:flex;align-items:center;gap:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.slot>h2 em{font-style:normal;font-weight:600;color:var(--muted);font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:.85rem}
.slot{gap:8px}
.visit{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.line{display:flex;align-items:center;gap:8px;padding-right:10px}
.grip{flex:none;width:30px;align-self:stretch;display:grid;place-items:center;color:var(--muted);margin-left:6px}
.visit .line{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.visit.dragging{transform-origin:center;scale:1.02}
.grip svg{width:18px;height:18px}
.visit.dragging{z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:none;opacity:.97}
.visit.dragging .grip{cursor:grabbing;color:var(--accent)}
.vname{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 4px 10px 6px;text-align:left}
.vname b{flex:1;min-width:0;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vname .chev{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .2s}
.visit.open .vname .chev{transform:rotate(90deg)}
.vcheck{width:44px;height:44px;flex:none;border-radius:11px;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--accent-ink)}
.vcheck svg{width:24px;height:24px}
.vcheck.is{background:var(--accent);border-color:var(--accent)}
.vcheck:disabled{opacity:.5}
.vcheck{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .15s}
.vcheck.pressing{transform:scale(.88)}
.vcheck.absent{background:var(--warn);border-color:var(--warn);color:#fff}
.abstag{flex:none;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 6px}
.visit.abs .vname b{color:var(--muted)}
.hint{color:var(--muted);font-size:.78rem;text-align:center}
.tagbtn{border:1px solid currentColor;cursor:pointer;font-family:inherit;padding:4px 9px}
.detail{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px 18px;border-top:1px dashed var(--line);padding-top:12px}
.visit.vu .vname b{color:var(--muted)}
.visit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.visit.plaine::before{background:var(--plaine)} .visit.montagne::before{background:var(--montagne)}
.visit.vu{background:var(--surface-2)}
.visit.vu .who,.visit.vu .soins{opacity:.6}
.num{min-width:30px;padding:0 5px;font-size:.8rem;height:30px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.visit .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who b{font-size:1.05rem}
.who .commune{color:var(--muted);font-size:.85rem}
.tag{font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.05em}
.tag.plaine{background:var(--plaine-soft);color:var(--plaine)} .tag.montagne{background:var(--montagne-soft);color:var(--montagne)}
.soins{display:flex;flex-wrap:wrap;gap:6px}
.soins span{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.82rem;border-radius:8px;padding:3px 8px}
.note{font-size:.88rem;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:8px 10px;border:1px dashed var(--line);overflow-wrap:anywhere}
.note small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.act{flex:1 1 auto;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink)}
.act svg{width:18px;height:18px;flex:none}
.act.vu{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex-basis:100%}
.act.vu.is{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.tel{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card>h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;font-size:.88rem}

.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:1.1rem}

/* Semaine */
.week{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day header button{background:none;border:0;padding:0;font-family:var(--f-display);font-weight:600;font-size:1.02rem;text-transform:capitalize;text-align:left}
.day header .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}
.daylist{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.9rem}
.daylist dt{color:var(--muted);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.daylist dd{margin:0;display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.mini{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:2px 7px;background:var(--surface-2);border:1px solid var(--line);font-size:.84rem}
.bil{color:var(--warn);font-weight:700;font-size:.85rem}
.card.rempl{gap:8px}
.bhsel{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;width:auto}
.hdrrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bilbtn{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;background:var(--bad);color:#fff}
.top .bilbtn{padding:3px 10px;font-size:.78rem}
.mini .short,.day .lshort{display:none}
.day[data-act]{cursor:pointer}
.day.rot{background:var(--rot);border-color:var(--rot-line)}
.day.rot.today{border-color:var(--accent)}
.rottag{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:.05em .4em;align-self:flex-start}
.rottag.plaine{background:var(--plaine-soft);color:var(--plaine)}
.rottag.montagne{background:var(--montagne-soft);color:var(--montagne)}
.rotbtn{letter-spacing:.06em}
.zoomgrp{display:inline-flex;align-items:center;gap:4px}
@media (orientation:landscape) and (min-width:600px){.week.roll.zbig .mini .full{display:inline}.week.roll.zbig .mini .short{display:none}}
.zb{font-size:1.2rem;font-weight:800;line-height:1}
.zb:disabled{opacity:.35}
.zl{font-size:.75rem;font-weight:700;color:var(--muted);min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
body[data-tab="semaine"] .datebar .d label{text-transform:none}
.week{touch-action:pan-y}
.week.slide-l{animation:slideL .28s ease-out}
.week.slide-r{animation:slideR .28s ease-out}
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.day.flash{border-color:var(--accent);background:var(--accent-soft);transition:background .4s}
.day[data-act]:hover{border-color:var(--accent)}
.addx{color:var(--accent);font-weight:800;margin-left:4px}
.cake{font-style:normal;margin-left:2px}
.exc{font-style:italic;color:var(--accent);font-weight:700;font-size:.85em;margin-left:3px}
.exctag{color:var(--accent);background:var(--accent-soft)}

/* Patients */
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow .i{flex:1;min-width:0}
.prow .i b{display:block}
.prow .i small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.status.ok{background:var(--ok-soft);color:var(--ok)} .status.warn{background:var(--warn-soft);color:var(--warn)} .status.bad{background:var(--bad-soft);color:var(--bad)} .status.none{background:var(--surface-2);color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1 1 180px}

/* Fiche */
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:86%}}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet .head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-wrap:balance}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.95rem}
dl.info dt{color:var(--muted);font-size:.8rem;font-weight:700;padding-top:2px}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.soinitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.soinitem .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.jours{display:flex;gap:4px}
.cadlbl{font-size:.82rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:3px 8px}
.jours span{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.jours span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
form.f{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick label{position:relative}
.daypick input{position:absolute;opacity:0;inset:0}
.daypick span{display:grid;place-items:center;width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:.85rem}
.daypick input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daypick input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.gpsbox{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:12px;padding:10px}
.gpsbtn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;color:var(--accent);font-weight:700;text-decoration:none;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.gpsbtn svg{width:20px;height:20px;flex:none}
.gpshint{color:var(--muted);font-size:.8rem}
.gpshint.ok{color:var(--ok);font-weight:700}
.gpshint.bad{color:var(--bad);font-weight:700}
.exportcta{display:flex;justify-content:center}

function parseGps(s){

  if(pc&&[4,6,8].includes(pc[1].length)) return (pc[1]+'+'+pc[2]).toUpperCase()+(pc[3]?' '+pc[3].trim():'');
  let lat,lng,m;
  if((m=s.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/))||(m=s.match(/(-?\d{1,2}[.,]\d+)\s*[,;\s]\s*(-?\d{1,3}[.,]\d+)/))){lat=+m[1].replace(',','.');lng=+m[2].replace(',','.')}
  else{const r=/(\d{1,3})\s*°\s*(\d{1,2})\s*['′’]\s*([\d.,]+)\s*["″”]?\s*([NSEWO])/gi;const v=[];let x;

  if(lat==null||isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return null;

/* liste pour la collègue : noms des patients, Montagne puis Plaine, chacun une seule fois ; les bilans à la fin */
function tourParts(d){ /* chaque passage compte : un patient vu 3 fois apparaît 3 fois */
  const all=visitesDu(d,'Toutes');
  const part=t=>all.filter(x=>(x.p.tournee||'')===t&&S.patients[x.s.patientId]).map(x=>({id:x.s.patientId,n:fullName(S.patients[x.s.patientId]),c:x.s.creneau||'Matin',h:x.s.heure||''}));
  const bil=Object.values(S.bilans).filter(x=>x.date===d&&S.patients[x.patientId]).sort((x,y)=>String(x.heure||'99').localeCompare(String(y.heure||'99')))
    .map(x=>{const tr=tourOf(x.patientId,d);return fullName(S.patients[x.patientId])+(tr?' ('+tr+')':'')});
  return [['Montagne',part('Montagne')],['Plaine',part('Plaine')],['Sans tournée',part('')],['Bilans',bil]];
}

function tcClick(e){
  const el=e.target.closest('[data-tc]'); if(!el||!TC) return;
  const a=el.dataset.tc;
  if(a==='bg'){if(e.target===el){TC=null;drawTC()}return}
  if(a==='close'){TC=null;drawTC();return}
  if(a==='day'){openTourCopy(addDays(TC.d,+el.dataset.n),TC);document.querySelector('#tcp .sheet').scrollTop=0;return}
  if(a==='sel'){const k=el.dataset.k,i=+el.dataset.i;TC.sel=(TC.sel&&TC.sel.k===k&&TC.sel.i===i)?null:{k,i};drawTC();return}
  if(a==='move'){ /* la bascule vaut pour tous les passages du patient ce jour-là, et pour la tournée du jour (export, vue du jour) */
    const {k,i}=TC.sel,x=TC.L[k][i],to=el.dataset.to,def=(S.patients[x.id]||{}).tournee,d=TC.d,key=d+'|'+x.id;
    if(!(key in TC.orig)) TC.orig[key]=((S.dayT||{})[d]||{})[x.id]||null;
    const mv=TC.L[k].filter(y=>y.id===x.id);TC.L[k]=TC.L[k].filter(y=>y.id!==x.id);tcSort(TC.L[to].push(...mv)&&TC.L[to]);TC.sel=null;drawTC();
    w([{t:'tournee',date:d,id:x.id,val:to===def?null:to}]).then(ok=>{if(ok)toast(x.n+' : '+to+' le '+fmtShort(d)+(to===def?' (tournée habituelle)':' seulement'));render();
      if(TC&&TC.d===d){const o=TC.orig;openTourCopy(d,{orig:o})}});
    return}
  if(a==='undo'){ /* remet chaque patient basculé dans sa tournée d'avant */
    const ops=Object.entries(TC.orig).map(([key,v])=>{const [d,id]=key.split('|');return {t:'tournee',date:d,id,val:v}});
    const d=TC.d;TC.orig={};
    const done=()=>{openTourCopy(d);render();toast('Tous les changements sont annulés.')};
    if(ops.length) w(ops).then(done); else done();
    return}
  if(a==='copy'){
    const block=L=>{let last='';const out=[];L.forEach(x=>{if(x.c!==last){out.push(x.c);last=x.c}out.push(x.n)});return out.join('\n')};

      .concat(TC.bil.length?['BILANS ('+TC.bil.length+') :\n'+TC.bil.join('\n')]:[]).join('\n\n');
    copyText('Tournée du '+fmtLong(TC.d)+'\n\n'+txt,'Liste copiée : collez-la dans le message à votre collègue.')}
}

    let r=false;try{r=document.execCommand('copy')}catch(_){}ta.remove();toast(r?ok:'Copie impossible ici : la tournée ne peut pas être copiée.')};

/* rotation : grande semaine (lun, mar, ven, sam, dim) / petite semaine (mer, jeu), en alternant plaine et montagne à chaque jour travaillé.
   Référence : semaine du lundi 12 octobre 2026 = grande semaine, mardi 13 octobre 2026 = plaine. */
const ROT_W0='2026-10-12',ROT_REF='2026-10-13';
const MOIS3=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
function rotWork(d){const wk=Math.floor(diffDays(ROT_W0,monday(d))/7),big=((wk%2)+2)%2===0,wd=wdIdx(d);return big?[0,1,4,5,6].includes(wd):[2,3].includes(wd)}
const ROTC={};
function rotInfo(d){
  if(d in ROTC) return ROTC[d];
  if(!rotWork(d)) return ROTC[d]=null;
  let n=0;
  if(d>=ROT_REF){for(let x=ROT_REF;x<d;x=addDays(x,1)) if(rotWork(x)) n++}
  else{for(let x=d;x<ROT_REF;x=addDays(x,1)) if(rotWork(x)) n--}
  return ROTC[d]=(((n%2)+2)%2===0?'Plaine':'Montagne');
}
function dayCol(d){

    const short=p=>p?esc((p.nom||'').toUpperCase())+(p.prenom?' '+esc(p.prenom[0])+'.':''):'?';
    const dl=parse(d);
    const rt=S.rot?rotInfo(d):null;
    h+=`<div class="day ${d===today()?'today':''} ${S.flash===d?'flash':''} ${rt?'rot':''}" ${S.canWrite?`data-act="addexc" data-d="${d}" role="button" tabindex="0" aria-label="Ajouter un passage exceptionnel le ${esc(fmtLong(d))}"`:''}><header><button data-act="openday" data-d="${d}"><span class="lfull">${esc(fmtLong(d))}</span><span class="lshort">${esc(dl.toLocaleDateString('fr-FR',{weekday:'short'}))} ${dl.getDate()} ${MOIS3[dl.getMonth()]}</span></button><span class="n"><span class="lfull">${v.length} passage${v.length>1?'s':''}</span><span class="lshort">${v.length} pass.</span>${S.canWrite?' <b class="addx" aria-hidden="true">+</b>':''}</span>${rt?`<span class="rottag ${tclass(rt)}">${rt}</span>`:''}</header>`;
    if(bil.length) h+=`<div class="bil">⚠ Bilan : <span class="lfull">${bil.map(b=>(b.heure?esc(b.heure)+' ':'')+esc(fullName(S.patients[b.patientId]))).join(', ')}</span><span class="lshort">${bil.map(b=>(b.heure?esc(b.heure)+' ':'')+short(S.patients[b.patientId])).join(', ')}</span></div>`;
    if(v.length){h+='<dl class="daylist">';CRENEAUX.forEach(c=>{const it=v.filter(x=>(x.s.creneau||'Matin')===c);if(!it.length)return;
      h+=`<dt>${c}</dt><dd>${it.map(x=>`<span class="mini" title="${esc(fullName(x.p))}"><i class="dot ${tclass(x.p.tournee)}"></i><span class="full">${esc(fullName(x.p))}</span><span class="short">${esc((x.p.nom||'').toUpperCase())}${x.p.prenom?' '+esc(x.p.prenom[0])+'.':''}</span>${x.s.exceptionnel?'<em class="exc">exc.</em>':''}${estAnniv(x.p,d)?'<span class="cake" title="Anniversaire">🎂</span>':''}</span>`).join('')}</dd>`;});h+='</dl>';}
    else h+='<span class="none" style="color:var(--muted);font-size:.9rem">Aucun passage</span>';
  return h+'</div>';
}
function rollLabel(first){const o={day:'numeric',month:'short'},n=Math.max(1,Math.round(S.zoom||7));return n===1?parse(first).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'}):'Du '+parse(first).toLocaleDateString('fr-FR',o)+' au '+parse(addDays(first,n-1)).toLocaleDateString('fr-FR',o)}

  h+=`<div class="toolbar"><input type="text" id="psearch" placeholder="Rechercher un patient" aria-label="Rechercher un patient" value="${esc(S.search)}" autocomplete="off">${S.canWrite?'<button class="btn" data-act="newpatient">+ Patient</button>':''}</div>`;
  h+=tourneeSeg('pfilter',S.pfilter);
  const q=S.search.trim().toLowerCase();
  const ps=Object.entries(S.patients).filter(([,p])=>(S.pfilter==='Toutes'||p.tournee===S.pfilter)&&(!q||(fullName(p)+' '+(p.commune||'')).toLowerCase().includes(q)))
    .sort((a,b)=>fullName(a[1]).localeCompare(fullName(b[1])));
  if(!Object.keys(S.patients).length) return h+`<div class="empty"><b>Aucun patient pour l'instant</b><span>Commencez par ajouter un patient, puis ses soins et les jours de passage.</span></div>`;
  if(!ps.length) return h+`<div class="empty"><b>Aucun patient trouvé</b></div>`;
  const rank={bad:0,warn:1,ok:2,none:3};
  h+=`<div class="plist">${ps.map(([id,p])=>{
    const ss=Object.values(S.soins).filter(s=>s.patientId===id);
    const worst=ss.map(ordo).sort((a,b)=>rank[a.k]-rank[b.k])[0];
    return `<button class="prow" data-act="openpatient" data-id="${esc(id)}"><i class="dot ${tclass(p.tournee)}" style="width:10px;height:10px"></i><span class="i"><b>${esc(fullName(p))}</b><small>${esc(p.commune||'')}${ss.length?' · '+ss.length+' soin'+(ss.length>1?'s':''):' · aucun soin'}</small></span>${worst?`<span class="status ${worst.k}">${esc(worst.k==='ok'?'En cours':worst.k==='none'?worst.label:worst.label.split(' ·')[0])}</span>`:''}</button>`;}).join('')}</div>`;
  return h;
}

function drawModal(){

  else if(M.mode==='soin'){title=M.add?'Ajouter un soin':M.sid?'Modifier le soin':'Nouveau soin';body=formSoin(M.sid?S.soins[M.sid]:{creneau:'Matin',jours:[1,1,1,1,1,1,1],soins:[]})}
  else if(M.mode==='bilan'){title='Programmer un bilan';body=formBilan()}

  else if(M.mode==='note'){const pp=S.patients[M.npid]||{};title='Note rapide · '+fullName(pp);body=`<form class="f" data-form="note">${pp.remarques?`<div class="note"><small>Remarques actuelles</small>${esc(pp.remarques)}</div>`:''}

  else {if(!p){closeModal();return} title=fullName(p);body=viewPatient(M.pid,p)}

    <div class="head"><h2>${esc(title)}</h2><button class="iconbtn" data-act="close" aria-label="Fermer">${ICON.close}</button></div>${body}</div></div>`;

async function loadExportDays(){
  const m=M; m.days=null; m.msg=null; drawModal();
  const map={};
  const rmap={};
  Object.keys(SV.days).forEach(d=>{if(d>=m.from&&d<=m.to){map[d]=SV.days[d];rmap[d]=(SV.dayR||{})[d]||null}});
  try{const q=await S.db.collection('passages').where('date','>=',m.from).where('date','<=',m.to).get();q.docs.forEach(d=>{const x=d.data()||{};map[x.date||d.id]=x.vus||{};rmap[x.date||d.id]=x.rempl||null})}catch(e){}
  if(M!==m) return;
  m.vus=map; m.rempl=rmap; m.days=[]; m.checked={};
  for(let d=m.from;d<=m.to;d=addDays(d,1)){
    const v=visitesDu(d,'Toutes'),vu=map[d]||{};
    const nVu=v.filter(x=>vu[x.id]===true).length,nAbs=v.filter(x=>vu[x.id]==='absent').length;

  }

}

function applyOp(v,op){
  if(op.t==='vu'){v.days[op.date]=Object.assign({},v.days[op.date]||{},{[op.id]:op.val});return}
  if(op.t==='day'){if(Object.keys(op.vus||{}).length)v.days[op.date]=Object.assign({},v.days[op.date]||{},op.vus);if(Object.keys(op.heures||{}).length)v.dayH[op.date]=Object.assign({},v.dayH[op.date]||{},op.heures);if(Object.keys(op.tournees||{}).length){v.dayT=v.dayT||{};v.dayT[op.date]=Object.assign({},v.dayT[op.date]||{},op.tournees)}if(op.rempl){v.dayR=v.dayR||{};v.dayR[op.date]=op.rempl}return}
  if(op.t==='heure'){v.dayH[op.date]=Object.assign({},v.dayH[op.date]||{},{[op.id]:op.val});return}
  if(op.t==='clearPassages'){v.days={};v.dayH={};v.dayT={};v.dayR={};return}
  const [c,id]=op.path.split('/');
  if(c==='config'){if(op.t==='set')v.config=op.data;return}
  const col=v[c]; if(!col) return;

  else if(op.t==='del') delete col[id];
}
function recompute(){

function w(ops){
  if(!S.canWrite) return Promise.resolve(false);
  ops.forEach(o=>{
    /* les coches et l'ordre d'une même journée sont regroupés en un seul envoi */
    if(o.t==='rempl'){const last=OUT[OUT.length-1];
      if(last&&last.t==='day'&&last.date===o.date&&last!==EXEC){last.rempl=o.val;return}
      OUT.push({t:'day',date:o.date,vus:{},heures:{},tournees:{},rempl:o.val});return}
    if(o.t==='vu'||o.t==='heure'||o.t==='tournee'){
      const key=o.t==='vu'?'vus':o.t==='heure'?'heures':'tournees',last=OUT[OUT.length-1];
      if(last&&last.t==='day'&&last.date===o.date&&last!==EXEC){last[key]=Object.assign({},last[key]||{},{[o.id]:o.val});return}
      OUT.push({t:'day',date:o.date,vus:{},heures:{},tournees:{},[key]:{[o.id]:o.val}});return}
    OUT.push(o)}); saveOut(); recompute(); render(); updatePending(); flushSoon(200);

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
async function execOp(db,op){
  if(op.t==='day'){const ref=db.doc('passages/'+op.date),data={};
    if(Object.keys(op.vus||{}).length)data.vus=op.vus;if(Object.keys(op.heures||{}).length)data.heures=op.heures;if(Object.keys(op.tournees||{}).length)data.tournees=op.tournees;if(op.rempl)data.rempl=op.rempl;
    try{await ref.update(data)}catch(e){if(e&&e.code==='invalid_argument'){await ref.set(Object.assign({date:op.date,vus:{},heures:{}},data))}else throw e}
    return}
  if(op.t==='vu'){const ref=db.doc('passages/'+op.date);const g=await ref.get();
    if(g.exists) await ref.update({vus:{[op.id]:op.val}}); else await ref.set({date:op.date,vus:{[op.id]:op.val}});return}
  if(op.t==='heure'){const ref=db.doc('passages/'+op.date);const g=await ref.get();
    if(g.exists) await ref.update({heures:{[op.id]:op.val}}); else await ref.set({date:op.date,vus:{},heures:{[op.id]:op.val}});return}
  if(op.t==='clearPassages'){const ps=await db.collection('passages').get();for(const d of ps.docs) await db.doc('passages/'+d.id).delete();return}

let flushing=false,flushT=null,EXEC=null;
const SYNC_MS=window.__LOCAL?0:60000;let lastFlush=0;
/* au plus un envoi par minute (batterie) ; tout reste gardé sur le téléphone en attendant */
function flushSoon(ms){
  if(flushT) return;
  const wait=Math.max(ms||0,lastFlush+SYNC_MS-Date.now());
  flushT=setTimeout(()=>{flushT=null;flush()},Math.max(0,wait));
}
function flushNow(){clearTimeout(flushT);flushT=null;flush()}
async function flush(){
  if(flushing||!S.db||!OUT.length){updatePending();return}
  flushing=true;lastFlush=Date.now();
  try{
    while(OUT.length){
      const op=OUT[0];EXEC=op;
      try{await withTimeout(execOp(S.db,op),12000);S.offline=false}
      catch(e){
        const c=e&&e.code;
        if(c==='invalid_argument'||c==='transform_error'||c==='quota_exceeded'){
          OUT.shift();saveOut();
          if(c==='quota_exceeded') toast('Espace plein : une modification n\'a pas pu être enregistrée.');
          else if(op.t==='set'&&S.canWrite){S.canWrite=false;toast('Vous pouvez consulter la tournée, pas la modifier.')}
          continue;
        }
        if(c==='revoked'||c==='not_granted'||c==='capability_disabled'){S.offline=true;break}
        S.offline=true; flushSoon(SYNC_MS); break;
      }
      /* confirmé par le serveur : on garde la valeur tout de suite, sans attendre le prochain rafraîchissement */
      if(op.t!=='clearPassages'){try{SV.dayH=SV.dayH||{};applyOp(SV,op);saveCache()}catch(_){}}
      OUT.shift(); saveOut();
    }
  } finally {flushing=false;EXEC=null;recompute();render();updatePending()}
}
function updatePending(){

  const n=OUT.length, off=S.offline||(typeof navigator!=='undefined'&&navigator.onLine===false);
  if(n&&!off){const age=performance.now()-(updatePending.t0||(updatePending.t0=performance.now()));
    if(age<90000){el.hidden=true;clearTimeout(updatePending.tt);updatePending.tt=setTimeout(updatePending,90100-age);return}}
  if(!n) updatePending.t0=0;
  if(n){el.hidden=false;el.className='pending'+(off?' off':'');el.textContent=(off?'Pas de réseau · ':'Envoi en cours · ')+n+' modification'+(n>1?'s':'')+' gardée'+(n>1?'s':'')+' sur le téléphone';}
  else if(off){el.hidden=false;el.className='pending off';el.textContent='Pas de réseau · tout est enregistré sur le téléphone';}
  else el.hidden=true;
}

async function delPatient(){
  const id=M.pid, sids=Object.keys(S.soins).filter(k=>S.soins[k].patientId===id);
  const bids=Object.keys(S.bilans).filter(k=>S.bilans[k].patientId===id);
  const ok=await w(sids.map(s=>({t:'del',path:'soins/'+s})).concat(bids.map(b=>({t:'del',path:'bilans/'+b})),[{t:'del',path:'patients/'+id}]));
  if(ok){closeModal();toast('Patient supprimé')}
}
async function resetAll(){
  S.confirmReset=false;
  const ops=[];
  for(const c of ['soins','patients','bilans','taches']){for(const k of Object.keys(S[c])) ops.push({t:'del',path:c+'/'+k});}
  ops.push({t:'clearPassages'},{t:'set',path:'config/app',data:{exemple:false}});
  const ok=await w(ops);
  if(ok) toast('Exemples effacés. À vous de jouer !'); render();
}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('nav.tabs button'); if(tab){S.tab=tab.dataset.tab;store.set('tab',S.tab);render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='overlay'){if(e.target===el) closeModal();return}
  switch(a){
    case 'day': setDate(addDays(S.date,+el.dataset.n));break;
    case 'today': setDate(today());break;
    case 'week': if(!rollBy(+el.dataset.n)){S.week=addDays(S.week,+el.dataset.n);render()}break;
    case 'zoom': setZoom(+el.dataset.n);break;
    case 'rot': S.rot=!S.rot;store.set('rot',S.rot?'1':'0');render();break;
    case 'thisweek': if(!rollToDate(monday(today()))){S.week=monday(today());render()}break;
    case 'openday': S.tab='jour';store.set('tab','jour');setDate(el.dataset.d);window.scrollTo(0,0);break;
    case 'seg': S[el.dataset.k]=el.dataset.v; if(el.dataset.k!=='pfilter') store.set(el.dataset.k,el.dataset.v); render();break;
    case 'vu': if(LP.fired){LP.fired=false;break} toggleVu(el.dataset.id);break;
    case 'expand': S.open=S.open===el.dataset.id?null:el.dataset.id;S.switchT=null;render();break;
    case 'asktournee': S.switchT=el.dataset.id;render();break;
    case 'tourneeno': S.switchT=null;render();break;
    case 'tourneeyes': {const pid=el.dataset.pid,to=el.dataset.to;S.switchT=null;
      if(S.tournee!=='Toutes'&&S.tournee!==to){S.open=null}
      const def=(S.patients[pid]||{}).tournee;w([{t:'tournee',date:S.date,id:pid,val:to===def?null:to}]).then(ok=>{if(ok)toast(fullName(S.patients[pid])+' : '+to+' le '+fmtShort(S.date)+(to===def?' (tournée habituelle)':' seulement'))});render();break;}
    case 'goalerts': S.tab='patients';store.set('tab','patients');render();window.scrollTo(0,0);break;
    case 'cleartaches': w(Object.entries(S.taches).filter(([,t])=>t.fait).map(([k])=>({t:'del',path:'taches/'+k})));break;
    case 'reset': S.confirmReset=true;render();break;
    case 'resetno': S.confirmReset=false;render();break;
    case 'resetyes': resetAll();break;
    case 'newpatient': openModal({pid:null,mode:'editp'});break;
    case 'openpatient': openModal({pid:el.dataset.id,mode:'view'});break;
    case 'close': closeModal();break;
    case 'backview': openModal({pid:M.pid,mode:'view'});break;
    case 'editp': openModal({pid:M.pid,mode:'editp'});break;
    case 'newsoin': {const mine=Object.entries(S.soins).filter(([,x])=>x.patientId===M.pid&&!x.exceptionnel)
        .sort((a,b)=>(b[1].soins||[]).length-(a[1].soins||[]).length);
      if(mine.length) openModal({pid:M.pid,mode:'soin',sid:mine[0][0],add:true}); else openModal({pid:M.pid,mode:'soin'});break;}
    case 'newsoinsep': openModal({pid:M.pid,mode:'soin'});break;
    case 'editsoin': openModal({pid:M.pid,mode:'soin',sid:el.dataset.id});break;
    case 'newbilan': openModal({pid:M.pid,mode:'bilan'});break;
    case 'newbilanw': {const t=today();openModal({pid:null,mode:'bilan',date:(t>=S.week&&t<=addDays(S.week,6))?t:S.week});break;}
    case 'addexc': if(S.canWrite) openModal({pid:null,mode:'exc',date:el.dataset.d});break;
    case 'backbil': openModal({pid:null,mode:'bilan',date:M.bilDraft.date,bdraft:M.bilDraft});break;
    case 'backexc': openModal({pid:null,mode:'exc',date:M.excDraft.date,draft:M.excDraft});break;
    case 'openexport': openExport();break;
    case 'addtel': openModal({pid:el.dataset.pid,mode:'editp'});setTimeout(()=>{const t=document.getElementById('f_tel');if(t){t.scrollIntoView({block:'center'});t.focus()}},80);break;
    case 'quicknote': openModal({pid:null,mode:'note',npid:el.dataset.pid});setTimeout(()=>{const t=document.getElementById('f_note');if(t)t.focus()},50);break;
    case 'quickexc': {const c=el.dataset.c;openModal({pid:null,mode:'exc',date:S.date,quick:true,draft:{pid:el.dataset.pid,creneau:c,creneaux:[c]}});break;}
    case 'pick': openPicker(el.dataset.for,el.dataset.req==='1');break;
    case 'pkclose': closePicker();break;
    case 'pkoverlay': if(e.target===el) closePicker();break;
    case 'pkset': pickSet(el.dataset.v);break;
    case 'pknew': PK.adding=true;drawPicker('pk_new');break;
    case 'pkback': PK.adding=false;drawPicker();break;
    case 'call': {if(window.__PWA)break;const n=el.dataset.tel||'';
      try{const sp=el.querySelector('.tel')||el.previousElementSibling;if(sp){const r=document.createRange();r.selectNodeContents(sp);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}}catch(_){}
      const done=()=>toast('Numéro copié : '+n+'. Si l\'appel ne se lance pas, collez-le dans votre téléphone.');
      try{navigator.clipboard.writeText(n).then(done,()=>toast('Numéro : '+n))}catch(_){toast('Numéro : '+n)}
      break;}
    case 'copytour': openTourCopy(addDays(S.date,1));break;
    case 'addimprevu': openModal({pid:null,mode:'exc',date:S.date,draft:{vu:true}});break;
    case 'expall': case 'expnone': (M.days||[]).forEach(x=>M.checked[x.d]=a==='expall');drawModal();break;
    case 'expsend': sendExport();break;
    case 'expdl': downloadExport();break;
    case 'delexc': {const ids=el.dataset.id.split(',').filter(Boolean);w(ids.map(x=>({t:'del',path:'soins/'+x}))).then(ok=>{if(ok)toast('Passage exceptionnel retiré')});break;}
    case 'delbilan': w([{t:'del',path:'bilans/'+el.dataset.id}]);break;
    case 'delsoin': {const sid=M.sid;w([{t:'del',path:'soins/'+sid}]).then(ok=>{if(ok){toast('Soin supprimé');openModal({pid:M.pid,mode:'view'})}});break;}
    case 'delp': M.confirm=true;drawModal();break;
    case 'delno': M.confirm=false;drawModal();break;
    case 'delyes': delPatient();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='datepick'&&el.value){setDate(el.value);return}
  if(el.id==='f_cad'){const sem=el.value==='sem';document.getElementById('f_joursbox').hidden=!sem;document.getElementById('f_depbox').hidden=sem;return}
  if(el.id==='f_xcreneau'){const box=document.getElementById('f_xheures');if(box){const hs={};CRENEAUX.forEach(c=>{const i=document.getElementById('f_xh_'+c);if(i)hs[c]=i.value});box.innerHTML=xheuresFields(el.value.split('+'),hs)}return}
  if(el.id==='f_creneau'){const box=document.getElementById('f_heures');if(box){const hs={};CRENEAUX.forEach(c=>{const i=document.getElementById('f_h_'+c);if(i)hs[c]=i.value});box.innerHTML=heuresFields(el.value.split('+'),hs)}return}
  if((el.id==='f_efrom'||el.id==='f_eto')&&M&&el.value){
    M[el.id==='f_efrom'?'from':'to']=el.value;
    if(M.from>M.to){const t=M.from;M.from=M.to;M.to=t}
    if(diffDays(M.from,M.to)>61) M.from=addDays(M.to,-61);
    loadExportDays();return}
  if(el.dataset.act==='expday'&&M){M.checked[el.dataset.d]=el.checked;return}
  if(el.id==='f_bpat'&&el.value==='__new'&&M){openModal({pid:null,mode:'editp',bilDraft:{date:val('f_bdate')||M.date||S.date,detail:val('f_bdetail'),heure:val('f_bheure')}});return}
  if(el.id==='f_xpat'&&el.value==='__new'&&M){
    const dr={date:val('f_xdate')||M.date,soins:[0,1,2].map(i=>val('f_xs'+i)).filter(Boolean),...readX(),vu:!!(document.getElementById('f_xvu')||{}).checked};
    openModal({pid:null,mode:'editp',excDraft:dr});return}
  if(el.dataset.act==='tache'){const id=el.dataset.id;w([{t:'update',path:'taches/'+id,data:{fait:el.checked}}])}
  if(el.classList&&el.classList.contains('bhsel')){const id=el.dataset.bid;w([{t:'update',path:'bilans/'+id,data:{heure:el.value}}]).then(ok=>{if(ok)toast(el.value?'Bilan à '+el.value:'Heure du bilan retirée')});return}
  if(el.id==='f_remplon'){const r=(S.dayR||{})[S.date]||{};w([{t:'rempl',date:S.date,val:{on:el.checked,prenom:r.prenom||''}}]).then(()=>{if(el.checked)setTimeout(()=>{const t=document.getElementById('f_remplnom');if(t)t.focus()},60)});return}
  if(el.id==='f_remplnom'){w([{t:'rempl',date:S.date,val:{on:true,prenom:el.value.trim()}}]).then(ok=>{if(ok&&el.value.trim())toast('Remplaçante : '+el.value.trim())});return}
  if(el.dataset.act==='bilan'&&!el.checked&&S.date<today()){el.checked=true;const id=el.dataset.id;askConfirm('Décocher ce bilan d\'une journée passée ('+fmtLong(S.date)+') ?',()=>w([{t:'update',path:'bilans/'+id,data:{fait:false}}]));return}
  if(el.dataset.act==='bilan'){const id=el.dataset.id;w([{t:'update',path:'bilans/'+id,data:{fait:el.checked}}])}
});
document.addEventListener('input',e=>{
  if(e.target.id==='pk_q'&&PK){PK.q=e.target.value;const l=document.querySelector('#picker .pklist');if(l)l.innerHTML=pkListHtml();return}
  if(/^f_xh_/.test(e.target.id)&&e.target.value){const sel=document.getElementById('f_xcreneau');
    if(sel&&!sel.value.includes('+')){const h=e.target.value,c2=h<'11:30'?'Matin':h<'15:00'?'Midi':'Soir';
      if(c2!==sel.value){sel.value=c2;const box=document.getElementById('f_xheures');box.innerHTML=xheuresFields([c2],{[c2]:h})}}}
if(e.target.id==='psearch'){S.search=e.target.value;render()}
  if(e.target.id==='f_email'&&M){M.email=e.target.value}
  if(e.target.id==='f_gps'){const h=document.getElementById('gpshint'),v=e.target.value.trim(),g=parseGps(v);
    h.className='gpshint'+(v?(g?' ok':' bad'):'');
    h.textContent=!v?'Dans Maps, restez appuyé sur l\'endroit exact puis ouvrez la fiche du point : le plus code s\'y affiche. Touchez-le pour le copier, puis collez-le ici.':g?'✓ Point reconnu : '+g:'Plus code non reconnu. Exemple attendu : MFXV+3X Bastia';}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target.dataset.form;
  if(f==='newtype'){pickAdd();return}
  if(f==='note'){const t=val('f_note');if(!t){showErr('Écrivez la note.');return}
    const pid=M.npid,pp=S.patients[pid]||{},d=parse(today()),stamp=pad(d.getDate())+'/'+pad(d.getMonth()+1);
    const rem=(pp.remarques?pp.remarques.trim()+' · ':'')+stamp+' : '+t;
    w([{t:'update',path:'patients/'+pid,data:{remarques:rem}}]).then(ok=>{if(ok){closeModal();toast('Note ajoutée aux remarques')}});return}
  if(f==='tache'){const t=val('newtache');if(!t)return;document.getElementById('newtache').value='';w([{t:'set',path:'taches/'+uid(),data:{texte:t,fait:false,cree:new Date().toISOString()}}]);}
  if(f==='patient') savePatient();
  if(f==='soin') saveSoin();
  if(f==='bilan') saveBilan();
  if(f==='exc') saveExc();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(PK)closePicker();else if(M)closeModal()}});
/* glisser horizontalement sur la semaine : semaine précédente / suivante */
const SW={x:0,y:0,t:0,on:false,block:false};
document.addEventListener('touchstart',e=>{
  if(S.tab!=='semaine'||M||e.touches.length!==1||!e.target.closest('.week')||document.getElementById('roll'))return;
  const t=e.touches[0];SW.x=t.clientX;SW.y=t.clientY;SW.t=Date.now();SW.on=true;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!SW.on)return;SW.on=false;
  const t=e.changedTouches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-SW.t<800){
    SW.block=true;setTimeout(()=>SW.block=false,400);
    const wk=document.querySelector('.week');
    S.week=addDays(S.week,dx<0?7:-7);render();
    const nw=document.querySelector('.week');
    if(nw&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){nw.classList.add(dx<0?'slide-l':'slide-r');setTimeout(()=>nw.classList.remove('slide-l','slide-r'),300)}
  }
},{passive:true});
document.addEventListener('touchcancel',()=>{SW.on=false},{passive:true});
document.addEventListener('click',e=>{if(SW.block&&e.target.closest('.week')){e.stopPropagation();e.preventDefault()}},true);
/* glisser un patient de haut en bas pour changer l'ordre de passage du jour */
var DG={on:false,pending:false};
/* appui long sur un patient (pas sur sa case) pour le déplacer ; un simple glissé fait défiler la page */
var LPD=null,DGEND=0;
document.addEventListener('pointerdown',e=>{
  if(!S.canWrite||DG.on||S.tab!=='jour') return;
  const art=e.target.closest&&e.target.closest('.visit'); if(!art||e.target.closest('.vcheck,.detail')) return;
  const slot=art.closest('.slot'); if(!slot) return;
  const pid=e.pointerId,x=e.clientX,y=e.clientY;
  clearTimeout(LPD&&LPD.t);
  LPD={pid,x,y,ly:y,art,t:setTimeout(()=>{
    if(!LPD||LPD.art!==art) return;
    try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}
    try{art.setPointerCapture(pid)}catch(_){}
    DG={on:true,t0:performance.now(),pending:false,art,slot,g:art,pid,y0:LPD.ly,base:art.getBoundingClientRect().top,start:[...slot.querySelectorAll('.visit')].map(a=>a.dataset.vid),lastY:LPD.ly,scrollT:0};
    art.classList.add('dragging');LPD=null;
  },450)};
});
document.addEventListener('pointermove',e=>{
  if(!LPD||e.pointerId!==LPD.pid) return;
  LPD.ly=e.clientY;
  if(Math.hypot(e.clientX-LPD.x,e.clientY-LPD.y)>8){clearTimeout(LPD.t);LPD=null}
});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{if(LPD&&e.pointerId===LPD.pid){clearTimeout(LPD.t);LPD=null}}));
/* pendant un déplacement, la page ne défile pas */
document.addEventListener('touchmove',e=>{if(DG.on&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.visit'))e.preventDefault()});
document.addEventListener('click',e=>{if(performance.now()-DGEND<400&&e.target.closest&&e.target.closest('.visit')){e.stopPropagation();e.preventDefault()}},true);
function dgMove(y){
  const {art,slot}=DG; DG.lastY=y;
  const ty0=parseFloat(art.dataset.ty)||0;
  const sibs=[...slot.querySelectorAll('.visit')].filter(a=>a!==art);
  let before=null;
  for(const sb of sibs){const r=sb.getBoundingClientRect();if(y<r.top+r.height/2){before=sb;break}}
  let nx=art.nextElementSibling; while(nx&&!nx.classList.contains('visit')) nx=nx.nextElementSibling;
  if(before!==nx&&sibs.length){
    const top0=art.getBoundingClientRect().top-ty0;
    if(before) slot.insertBefore(art,before); else sibs[sibs.length-1].after(art);
    const top1=art.getBoundingClientRect().top-ty0;
    DG.shift=(DG.shift||0)+(top1-top0);
  }
  const ty=y-DG.y0-(DG.shift||0)+(window.scrollY-(DG.sy0??(DG.sy0=window.scrollY)));
  art.dataset.ty=ty; art.style.transform='translateY('+ty+'px)';
}
document.addEventListener('pointermove',e=>{
  if(!DG.on||e.pointerId!==DG.pid) return; e.preventDefault();
  dgMove(e.clientY);
  const vh=window.innerHeight,edge=70;
  clearInterval(DG.scrollT);
  if(e.clientY<edge+60||e.clientY>vh-edge-60){const dir=e.clientY<edge+60?-1:1;
    DG.scrollT=setInterval(()=>{window.scrollBy(0,dir*8);dgMove(DG.lastY)},16)}
},{passive:false});
function dgEnd(e){
  if(!DG.on||(e&&e.pointerId!==DG.pid)) return;
  DGEND=performance.now();
  clearInterval(DG.scrollT);
  const {art,slot,start}=DG;
  art.classList.remove('dragging');art.style.transform='';delete art.dataset.ty;
  const arts=[...slot.querySelectorAll('.visit')],ids=arts.map(a=>a.dataset.vid);
  DG={on:false,pending:false};
  if(ids.join('|')===start.join('|')){render();return}
  const c=art.dataset.c||'Matin',base=BASE[c]||'06:00';
  /* nouvel ordre pour la tournée du patient déplacé : 6h00, 6h15, 6h30… */
  const grp=arts.filter(a=>a.dataset.t===art.dataset.t);
  const ops=grp.map((a,i)=>({t:'heure',date:S.date,id:a.dataset.vid,val:fromMin(toMin(base)+15*i)}));
  if(ops.length){w(ops);toast('Ordre modifié pour le '+fmtShort(S.date))} else render();
}
document.addEventListener('pointerup',dgEnd);
document.addEventListener('pointercancel',dgEnd);
/* appui long sur la case : absent */
const LP={t:null,fired:false,el:null};
function lpCancel(){clearTimeout(LP.t);LP.t=null;if(LP.el)LP.el.classList.remove('pressing');LP.el=null}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.vcheck'); if(!el||el.disabled) return;
  LP.fired=false; LP.el=el; el.classList.add('pressing');
  const id=el.dataset.id;
  LP.t=setTimeout(()=>{LP.fired=true;lpCancel();try{navigator.vibrate&&navigator.vibrate(40)}catch(_){}
    if(S.vus[id]==='absent'){if(S.date<today()){askConfirm('Annuler cette absence d\'une journée passée ('+fmtLong(S.date)+') ?',()=>{setVu(id,false);toast('Absence annulée')});return}setVu(id,false);toast('Absence annulée')}
    else{setVu(id,'absent');toast(fullName((S.patients[(S.soins[id]||{}).patientId]))+' noté absent')}},550);
});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,lpCancel,true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.vcheck'))e.preventDefault()});

/* ---------- connexion aux données ---------- */
let unsubDay=null;
function subDay(){
  if(unsubDay) unsubDay();
  recompute();
  if(!S.db) return;
  const d=S.date;
  unsubDay=S.db.doc('passages/'+d).onSnapshot(snap=>{const dd=snap.exists?(snap.data()||{}):{};SV.days[d]=dd.vus||{};SV.dayH=SV.dayH||{};SV.dayH[d]=dd.heures||{};SV.dayT=SV.dayT||{};SV.dayT[d]=dd.tournees||{};SV.dayR=SV.dayR||{};SV.dayR[d]=dd.rempl||null;saveCache();if(d!==S.date)return;recompute();render()},()=>{});
}
function setDate(d){if(d===S.date){render();return}S.date=d;subDay();render()}
function subCol(name){
  S.db.collection(name).onSnapshot(snap=>{if(snap.metadata&&snap.metadata.fromCache&&!snap.size&&Object.keys(SV[name]).length)return;const o={};snap.docs.forEach(d=>o[d.id]=d.data());SV[name]=o;saveCache();recompute();S.loaded.add(name);render();if(M)refreshModal()},err=>{S.loaded.add(name);render()});
}
function refreshModal(){ if(M&&M.mode==='view') drawModal(); }

recompute();render();updatePending();
if(!window.claude||!window.claude.use){S.dbState='none';render();}
else{
  window.claude.use('db').then(db=>{
    if(!db){S.dbState='none';render();return}
    S.db=db;S.dbState='ok';
    ['patients','soins','bilans','taches','typesoins'].forEach(subCol);
    /* toutes les journées (coches, ordre, tournée du jour) pour la vue semaine */
    db.collection('passages').onSnapshot(snap=>{snap.docs.forEach(x=>{const dd=x.data()||{};SV.days[x.id]=dd.vus||{};SV.dayH=SV.dayH||{};SV.dayH[x.id]=dd.heures||{};SV.dayT=SV.dayT||{};SV.dayT[x.id]=dd.tournees||{};SV.dayR=SV.dayR||{};SV.dayR[x.id]=dd.rempl||null});saveCache();recompute();render()},()=>{});
    db.doc('config/app').onSnapshot(s=>{SV.config=s.exists?s.data():{};saveCache();recompute();render()},()=>{});
    subDay();render();flushSoon(0);
  }).catch(()=>{S.dbState='none';render()});
  window.claude.use('user').then(u=>{
    if(!u||!u.can) return;
    Promise.resolve(u.can('data.write')).then(v=>{if(v===false){S.canWrite=false;render()}}).catch(()=>{});
  }).catch(()=>{});
}
// le jour change à minuit : on suit si l'appli reste ouverte sur « aujourd'hui »
let lastToday=today();
setInterval(()=>{const t=today();if(t!==lastToday){const wasToday=S.date===lastToday;lastToday=t;if(wasToday)setDate(t);else render()}},60000);
})();
